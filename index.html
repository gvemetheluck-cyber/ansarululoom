<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ansarul Uloom Madrasa, Andona, Thamarassery | Meelad Fest 2026</title>
  <meta name="description" content="Official Portal for Ansarul Uloom Madrasa, Andona, Thamarassery, Kozhikkode. Meelad Fest 2026 Team Leaderboard (Quaf, Noon, Meem), Student Records & Results.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            organic: {
              darkBg: '#06140E',
              darkBgGrad: '#0C2219',
              cardGreen: '#12382A',
              cardBrown: '#3D241B',
              cardSand: '#DDB892',
              pillGold: '#E6C594',
              pillGreen: '#2D6A4F',
              creamText: '#F5EBE0',
              muted: '#A3B18A',
              darkText: '#1B2A23'
            }
          },
          fontFamily: {
            title: ['Outfit', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            arabic: ['Amiri', 'serif']
          },
          borderRadius: {
            '4xl': '2rem',
            '5xl': '2.5rem'
          }
        }
      }
    }
  </script>
  
  <!-- Main Styling -->
  <link rel="stylesheet" href="src/css/main.css">
</head>
<body class="bg-[#06140E] text-organic-creamText font-body antialiased selection:bg-amber-400 selection:text-organic-darkBg flex flex-col min-h-screen">
  
  <!-- Background Canvas for Ambient Leaf Animation -->
  <canvas id="organic-leaf-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- Navigation Container -->
  <header id="navbar-container" class="sticky top-0 z-50 transition-all duration-300"></header>

  <!-- Main View Container -->
  <main id="main-content" class="flex-grow z-10 relative"></main>

  <!-- Footer Container -->
  <footer id="footer-container" class="relative z-10"></footer>

  <!-- Global Modal Dialog Container -->
  <div id="modal-container" class="modal-overlay">
    <div id="modal-content" class="modal-card card-green rounded-4xl border border-emerald-700/60 shadow-2xl relative"></div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application Modules -->
  <script src="src/js/db.js"></script>
  <script src="src/js/components/navbar.js"></script>
  <script src="src/js/components/hero.js"></script>
  <script src="src/js/components/programs.js"></script>
  <script src="src/js/components/events.js"></script>
  <script src="src/js/components/student-db.js"></script>
  <script src="src/js/components/results.js"></script>
  <script src="src/js/components/judge-portal.js"></script>
  <script src="src/js/components/footer.js"></script>
